name: MathMagic Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fractions-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and Chrome for H.264/AAC playback
        run: npx playwright install --with-deps chromium chrome webkit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently validate Year 5 measurement mathematics
        run: |
          python -m pip install sympy==1.14.0
          node tests/export-measurement.cjs /tmp/measurement-variants.json
          python tests/validate-measurement.py /tmp/measurement-variants.json
      - name: Test isolated Year 5 Firestore rules and progress
        run: npm run test:measurement:emulator
      - name: Check protected Fractions architecture
        run: npm run test:protected
      - name: Provide a virtual audio output for unmuted WebKit playback
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mathmagic_test_audio
          pactl set-default-sink mathmagic_test_audio
          pactl info
      - name: Verify native WebKit lesson playback before full regression
        run: npx playwright test --project=measurement-webkit --grep "graphics-only Choose Units" --retries=0
      - name: Run MathMagic browser QA
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve small browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-failure-images
          path: |
            test-results/**/test-failed-1.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
