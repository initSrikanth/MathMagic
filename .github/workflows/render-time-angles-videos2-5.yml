name: Render Time and Angles Videos 1–5 (Kokoro)
# Preserve approved cream-background graphics and Kokoro hf_alpha voice.
# Five independent lessons; publish only successfully rendered and verified files.
on:
  push:
    paths:
      - '.github/workflows/render-time-angles-videos2-5.yml'
      - 'video-agent/time-angles/render_video1.py'
      - 'video-agent/time-angles/render_video2.py'
      - 'video-agent/time-angles/render_video3.py'
      - 'video-agent/time-angles/render_video4.py'
      - 'video-agent/time-angles/render_video5.py'
  workflow_dispatch:
concurrency:
  group: time-angles-videos-2-to-5
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved MathMagic rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'sherpa-onnx==1.12.26' pillow numpy scipy soundfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache Kokoro v1.0 model
        uses: actions/cache@v4
        with:
          path: work/kokoro-multi-lang-v1_0
          key: mathmagic-kokoro-multi-lang-v1_0
      - name: Obtain the exact approved Kokoro voice model
        run: |
          if [ ! -s work/kokoro-multi-lang-v1_0/voices.bin ]; then
            mkdir -p work
            curl --fail --location --retry 3 --retry-delay 10 \
              'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2' \
              -o work/kokoro-model.tar.bz2
            tar -xjf work/kokoro-model.tar.bz2 -C work
            rm work/kokoro-model.tar.bz2
          fi
          test -s work/kokoro-multi-lang-v1_0/model.onnx
          test -s work/kokoro-multi-lang-v1_0/voices.bin
      - name: Golden Rules preflight for all five lessons
        run: python video-agent/time-angles/verify_golden_rules.py
      - name: Render all five lessons using Kokoro hf_alpha (no fallback)
        env:
          KOKORO_MODEL: work/kokoro-multi-lang-v1_0
        run: |
          for n in 1 2 3 4 5; do python video-agent/time-angles/render_video${n}.py; done
      - name: Verify every MP4 before publishing
        run: |
          set -euo pipefail
          for n in 01 02 03 04 05; do
            f=$(find videos -maxdepth 1 -name "MathMagic_Time_Angles_${n}_*.mp4" | head -n 1)
            test -s "$f"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$f" | grep -q aac
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$f" | grep -q h264
            ffmpeg -v error -i "$f" -f null -
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f"
          done
      - name: Upload verified video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Time-Angles-Videos-1-to-5
          path: videos/MathMagic_Time_Angles_0[1-5]_*.mp4
          retention-days: 30
      - name: Commit and publish verified videos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f videos/MathMagic_Time_Angles_0[2-5]_*.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Time and Angles videos 1 to 5'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
