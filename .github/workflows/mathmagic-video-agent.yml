name: MathMagic Comparing Fractions Video
on:
  pull_request:
    paths:
      - 'video-agent/**'
      - '.github/workflows/mathmagic-video-agent.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-comparing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-production-agent
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r video-agent/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Produce Comparing Fractions classroom MP4
        run: |
          python video-agent/produce_comparing.py
          test -s videos/MathMagic_Comparing_Fractions_FINAL.mp4
      - name: Publish classroom video to live main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-comparing origin/main
          git add -f videos/MathMagic_Comparing_Fractions_FINAL.mp4
          git commit -m "Publish Comparing Fractions classroom video"
          git push origin HEAD:main
      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: mathmagic-comparing-fractions-final
          path: videos/MathMagic_Comparing_Fractions_FINAL.mp4
          retention-days: 30
