name: Render Time and Angles Video 1 (Kokoro)
# Preserve approved cream-background graphics and Kokoro hf_alpha voice.
# Video 1 only: subsequent lessons require their own verified scripts.
on:
  push:
    paths:
      - '.github/workflows/render-time-angles-video1.yml'
      - 'video-agent/time-angles/render_video1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-video1:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved MathMagic rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'sherpa-onnx==1.12.26' pillow numpy scipy soundfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache Kokoro v1.0 model
        uses: actions/cache@v4
        with:
          path: work/kokoro-multi-lang-v1_0
          key: mathmagic-kokoro-multi-lang-v1_0
      - name: Obtain the exact approved Kokoro voice model
        run: |
          if [ ! -s work/kokoro-multi-lang-v1_0/voices.bin ]; then
            mkdir -p work
            curl --fail --location --retry 3 --retry-delay 10 \
              'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2' \
              -o work/kokoro-model.tar.bz2
            tar -xjf work/kokoro-model.tar.bz2 -C work
            rm work/kokoro-model.tar.bz2
          fi
          test -s work/kokoro-multi-lang-v1_0/model.onnx
          test -s work/kokoro-multi-lang-v1_0/voices.bin
      - name: Render Video 1 using Kokoro hf_alpha (no fallback)
        env:
          KOKORO_MODEL: work/kokoro-multi-lang-v1_0
        run: python video-agent/time-angles/render_video1.py
      - name: Verify playable MP4 with audible narration
        run: |
          test -s videos/MathMagic_Time_Angles_01_Reading_Time_and_Duration.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 videos/MathMagic_Time_Angles_01_Reading_Time_and_Duration.mp4 | grep -q aac
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 videos/MathMagic_Time_Angles_01_Reading_Time_and_Duration.mp4 | grep -q h264
          ffmpeg -v error -i videos/MathMagic_Time_Angles_01_Reading_Time_and_Duration.mp4 -f null -
      - name: Save video for viewing
        uses: actions/upload-artifact@v4
        with:
          name: MathMagic-Time-Angles-Video1-Kokoro
          path: videos/MathMagic_Time_Angles_01_Reading_Time_and_Duration.mp4
          retention-days: 30
      - name: Publish video file to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f videos/MathMagic_Time_Angles_01_Reading_Time_and_Duration.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Render Time and Angles Video 1 with Kokoro hf_alpha'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
