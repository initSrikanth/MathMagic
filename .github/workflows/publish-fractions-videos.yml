name: Publish MathMagic Comparing Fractions
on:
  push:
    paths:
      - '.github/workflows/publish-fractions-videos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  comparing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out video renderer
        uses: actions/checkout@v4
        with:
          ref: feature/video-production-agent
          path: production
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r production/video-agent/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Produce Comparing Fractions classroom video
        run: |
          cd production
          python video-agent/produce_comparing.py
          test -s videos/MathMagic_Comparing_Fractions_FINAL.mp4
      - name: Publish Comparing Fractions MP4 only
        run: |
          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp videos/MathMagic_Comparing_Fractions_FINAL.mp4 /tmp/MathMagic_Comparing_Fractions_FINAL.mp4
          git fetch origin main
          git checkout -B publish-comparing origin/main
          mkdir -p videos
          cp /tmp/MathMagic_Comparing_Fractions_FINAL.mp4 videos/MathMagic_Comparing_Fractions_FINAL.mp4
          git add -f videos/MathMagic_Comparing_Fractions_FINAL.mp4
          git commit -m "Publish corrected Comparing Fractions lesson video"
          git push origin HEAD:main
