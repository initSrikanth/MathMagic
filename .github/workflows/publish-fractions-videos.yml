name: Publish Comparing Fractions Classroom MP4
on:
  push:
    paths:
      - '.github/workflows/publish-fractions-videos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-comparing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-production-agent
          path: production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          pip install -r production/video-agent/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble Comparing Fractions classroom MP4
        run: |
          cd production
          python video-agent/produce_comparing.py
          test -s videos/MathMagic_Comparing_Fractions_FINAL.mp4
      - name: Publish only Comparing Fractions video without touching Equivalent Fractions
        run: |
          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-comparing origin/main
          git add -f videos/MathMagic_Comparing_Fractions_FINAL.mp4
          git commit -m "Publish Comparing Fractions classroom MP4"
          git push origin HEAD:main
