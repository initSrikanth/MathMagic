name: Publish MathMagic Fractions Videos
on:
  push:
    paths:
      - '.github/workflows/publish-fractions-videos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-production-agent
          path: production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video production dependencies
        run: |
          pip install -r production/video-agent/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render both completed presenter videos with classroom whiteboards
        run: |
          cd production
          python video-agent/produce_equivalent.py
          python video-agent/produce_comparing.py
          test -s videos/MathMagic_Equivalent_Fractions_FINAL.mp4
          test -s videos/MathMagic_Comparing_Fractions_FINAL.mp4
      - name: Commit both videos and the updated Fractions page to main
        run: |
          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-fractions origin/main
          git checkout feature/video-production-agent -- fractions.html
          git add fractions.html
          git add -f videos/MathMagic_Equivalent_Fractions_FINAL.mp4 videos/MathMagic_Comparing_Fractions_FINAL.mp4
          git commit -m "Embed Comparing and Equivalent Fractions lesson videos on MathMagic"
          git push origin HEAD:main
